[server]
bind = "0.0.0.0:8080"
max_body_bytes = 1048576
request_timeout_ms = 30000
json_logs = false
config_reload_debounce_ms = 250

[proxy]
connect_timeout_ms = 1000
upstream_timeout_ms = 8000
preserve_query = true
add_decision_headers = true

[extraction]
routing_text_header = "x-semantic-query"
role_header = "x-user-roles"
domain_header = "x-service-domain"
sticky_header = "x-conversation-id"
json_pointers = ["/query", "/text", "/description", "/message"]
max_semantic_chars = 4096

[retrieval]
candidate_limit = 16
bm25_k1 = 1.2
bm25_b = 0.75
ann_tables = 4
ann_bits_per_table = 12
ann_probe_radius = 1

[scoring]
embedding_weight = 0.38
bm25_weight = 0.30
metadata_weight = 0.14
schema_weight = 0.10
quality_weight = 0.08

[decision]
minimum_score = 0.32
confident_score = 0.68
confident_margin = 0.08
ambiguity_margin = 0.035
temperature = 0.10
top_k = 5
ambiguity_strategy = "clarify"

[embedding]
mode = "hashing"
dimensions = 384
model = "text-embedding-3-small"
timeout_ms = 500
cache_entries = 10000

[health]
interval_ms = 2000
timeout_ms = 500
failure_threshold = 3
success_threshold = 2
circuit_open_ms = 10000
half_open_max_requests = 1

[adaptation]
enabled = true
learning_rate = 0.05
max_step = 0.02
min_quality = 0.25
max_quality = 0.98
min_feedback_samples = 3
feedback_token_env = "HYBRIDROUTE_FEEDBACK_TOKEN"

[observability]
metrics_path = "/metrics"
service_name = "hybridroute"

[[routes]]
id = "streetlight-report"
target = "http://streetlight-api:8080"
rewrite_path = "/handle"
description = "Report broken damaged blinking dark or non-functional public streetlights and lamps"
examples = ["The streetlight is broken", "A public lamp is blinking", "The road is dark because lighting failed"]
methods = ["POST"]
content_types = ["application/json"]
domains = ["infrastructure"]
quality = 0.90
health_path = "/healthz"
[routes.keywords]
streetlight = 2.0
lamp = 1.3
lighting = 1.2
broken = 1.0
blinking = 1.2

[[routes]]
id = "parking-permit"
