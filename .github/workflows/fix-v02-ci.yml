name: fix-v02-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'agent/fix-v02-build-compose' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Fix Rust build issues
        shell: python
        run: |
          from pathlib import Path

          operations = Path('src/operations.rs')
          text = operations.read_text()
          old = '        entry.lock().await.quality\n'
          new = '        let quality = entry.lock().await.quality;\n        quality\n'
          if old in text:
              operations.write_text(text.replace(old, new, 1))
          elif 'let quality = entry.lock().await.quality;' not in text:
              raise SystemExit('Expected operations.rs quality expression not found')

          router = Path('src/router.rs')
          text = router.read_text()
          unused = '    pub fn runtime(&self) -> &RuntimeManager { &self.runtime }\n'
          if unused in text:
              router.write_text(text.replace(unused, '', 1))
          elif 'pub fn runtime(&self)' in text:
              raise SystemExit('Unexpected RouterEngine::runtime formatting')

      - name: Format Rust source
        run: cargo fmt --all

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Build and start Compose smoke stack
        run: docker compose up --build --detach hybridroute

      - name: Run Compose smoke test
        run: bash ./scripts/smoke-test.sh

      - name: Show Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Commit verified fixes
        if: success()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Fix v0.2 Rust build and Compose smoke [ci-fix applied]'
          git push origin "HEAD:${HEAD_BRANCH}"
