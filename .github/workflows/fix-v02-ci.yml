name: fix-v02-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'agent/v0.2-clean-implementation' && !contains(github.event.pull_request.head.sha, '0000000') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Fix borrow lifetime
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/operations.rs')
          text = path.read_text()
          old = '''        let Some(entry) = self.routes.get(route_id).map(|v| Arc::clone(v.value())) else { return configured; };
          entry.lock().await.quality
          '''
          new = '''        let Some(entry) = self.routes.get(route_id).map(|v| Arc::clone(v.value())) else { return configured; };
          let quality = entry.lock().await.quality;
          quality
          '''
          if old not in text:
              if 'let quality = entry.lock().await.quality;' in text:
                  print('Borrow-lifetime fix is already present.')
              else:
                  raise SystemExit('Expected operations.rs pattern not found')
          else:
              path.write_text(text.replace(old, new, 1))

      - name: Format Rust source
        run: cargo fmt --all

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Build and start Compose stack
        run: docker compose up --build --detach

      - name: Run Compose smoke test
        run: bash ./scripts/smoke-test.sh

      - name: Show Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Commit verified fixes
        if: success()
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Fix Rust formatting and operational-state lifetime [ci-fix applied]'
          git push origin "HEAD:${HEAD_BRANCH}"
