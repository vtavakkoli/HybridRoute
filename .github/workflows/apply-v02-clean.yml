name: apply-v02-clean

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, '[v0.2 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and publish clean v0.2 source
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          for file in .bootstrap/part*; do
            printf '%s %s ' "$(basename "$file")" "$(wc -c < "$file")"
            git hash-object "$file"
          done

          cat .bootstrap/part* | base64 --decode > /tmp/hrv2-clean.tar.gz
          echo "2864a40ff8e16dfcccc04e5a0ef059256dcb9edf95c6fe845d369fae53f46316  /tmp/hrv2-clean.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/hrv2-clean.tar.gz
          tar -tzf /tmp/hrv2-clean.tar.gz >/dev/null
          tar -xzf /tmp/hrv2-clean.tar.gz

          rm -rf .bootstrap
          rm -f .github/workflows/apply-v02-clean.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add HybridRoute v0.2 advanced routing and benchmark [v0.2 applied]"
          git push origin "HEAD:${HEAD_BRANCH}"
