name: apply-v02-clean

on:
  push:
    branches:
      - agent/v0.2-clean-implementation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v0.2 applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/v0.2-clean-implementation
          fetch-depth: 0

      - name: Verify and publish clean v0.2 source
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/part* | base64 --decode > /tmp/hrv2-clean.tar.gz
          echo "2864a40ff8e16dfcccc04e5a0ef059256dcb9edf95c6fe845d369fae53f46316  /tmp/hrv2-clean.tar.gz" | sha256sum --check --strict
          gzip --test /tmp/hrv2-clean.tar.gz
          tar -tzf /tmp/hrv2-clean.tar.gz >/dev/null
          tar -xzf /tmp/hrv2-clean.tar.gz

          rm -rf .bootstrap
          rm -f .github/workflows/apply-v02-clean.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add HybridRoute v0.2 advanced routing and benchmark [v0.2 applied]"
          git push origin HEAD:agent/v0.2-clean-implementation
