[package]
name = "hybridroute"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A high-performance hybrid semantic API router with BM25, ANN, hot reload, safety constraints, and observability."
license = "MIT"
repository = "https://github.com/vtavakkoli/HybridRoute"
keywords = ["semantic-routing", "api-gateway", "reverse-proxy", "embeddings", "rust"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
local-embeddings = ["dep:fastembed"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = "0.8"
blake3 = "1.8"
bytes = "1.10"
dashmap = "6.1"
fastembed = { version = "5.17", optional = true }
http = "1.3"
moka = { version = "0.12", features = ["future"] }
notify = "8.2"
opentelemetry = { version = "0.30", optional = true }
opentelemetry_sdk = { version = "0.30", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.30", optional = true, features = ["trace", "metrics", "grpc-tonic"] }
prometheus-client = "0.24"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["catch-panic", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
