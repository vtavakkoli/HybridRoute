[package]
name = "hybridroute"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A high-performance hybrid semantic API router combining policy filters, weighted keywords, vector similarity, and confidence-aware route selection."
license = "MIT"
repository = "https://github.com/vtavakkoli/HybridRoute"
keywords = ["semantic-routing", "api-gateway", "reverse-proxy", "embeddings", "rust"]
categories = ["web-programming::http-server", "network-programming"]

[features]
default = []
local-embeddings = ["dep:fastembed"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
blake3 = "1.8"
bytes = "1.10"
fastembed = { version = "5.17", optional = true }
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "net", "fs", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["catch-panic", "request-id", "sensitive-headers", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
